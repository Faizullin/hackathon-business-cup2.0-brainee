<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mirror Grid</title>
  <link rel="stylesheet" href="./session.css" />
  <script src="../bridge.js"></script>
  <script src="./lib/easeljs.js"></script>
</head>
<body>
  <div id="game-app">
    <header class="game-header">
      <div id="session-progress" class="session-progress">Pattern 1 of 4</div>
      <h1 class="game-title">Mirror Grid</h1>
    </header>

    <main class="board-area">
      <div class="canvas-container" id="canvas-container">
        <canvas id="actualcanvas"></canvas>
        <div id="dots-overlay" class="dots-overlay"></div>
      </div>
    </main>

    <footer class="game-footer">
      <p id="session-message" role="status" class="session-message">Color the other half as a mirror image.</p>
      <button type="button" id="check-btn" data-action="check" class="check-button">Check</button>
    </footer>

    <section id="session-complete" class="session-complete" style="display: none;">
      <h1>All 4 patterns are done!</h1>
    </section>
  </div>

  <script type="module" src="./session.js"></script>
</body>
</html>

packages:
  - apps/*
  - packages/*
  - games/*

# Used by Vitest/tsx and Drizzle Kit; keep other dependency scripts blocked.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@playwright/test@1.65.1"
  - playwright-core@1.65.1
  - playwright@1.65.1
  - framer-motion@14.14.0
  - lucide-react@1.73.0
  - motion-dom@14.14.0
  - motion@14.14.0

saveExact: true
